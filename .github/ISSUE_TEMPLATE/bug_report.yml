name: Reportar un error
description: Algo no funciona como debería
labels: ["bug"]
body:
  - type: textarea
    id: descripcion
    attributes:
      label: Descripción
      description: Qué pasó y qué esperabas que pasara.
    validations:
      required: true
  - type: textarea
    id: pasos
    attributes:
      label: Pasos para reproducirlo
      placeholder: |
        1. Abrir Mousecli
        2. Conectar el teléfono
        3. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Versión de Mousecli
      placeholder: v0.1.0
    validations:
      required: true
  - type: dropdown
    id: so
    attributes:
      label: Sistema operativo del PC
      options: [Windows, macOS, Linux (X11), Linux (Wayland)]
    validations:
      required: true
  - type: input
    id: telefono
    attributes:
      label: Teléfono y navegador
      placeholder: Android 15, Chrome / iPhone 16, Safari
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Registro (opcional)
      description: |
        Contenido de mousecli.log. En Windows está en %APPDATA%\Mousecli, en macOS en
        ~/Library/Application Support/Mousecli y en Linux en ~/.config/mousecli.
      render: text
