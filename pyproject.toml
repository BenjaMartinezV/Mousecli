[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mousecli"
version = "0.2.0"
description = "Usa tu teléfono como control de presentaciones: diapositivas, puntero láser, volumen, touchpad y dictado."
readme = "README.md"
license = "MIT"
authors = [{ name = "BenjaMartinezV" }]
requires-python = ">=3.9"
keywords = ["presentation", "remote", "clicker", "laser-pointer", "powerpoint", "presentaciones"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "Natural Language :: Spanish",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Graphics :: Presentation",
]
dependencies = [
    "aiohttp>=3.9",
    "pynput>=1.7",
    "qrcode>=7.4",
    "PyQt6>=6.5",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-aiohttp>=1.0", "ruff>=0.6"]

[project.urls]
Homepage = "https://github.com/BenjaMartinezV/Mousecli"
Issues = "https://github.com/BenjaMartinezV/Mousecli/issues"
Releases = "https://github.com/BenjaMartinezV/Mousecli/releases"

[project.scripts]
mousecli = "mousecli.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mousecli"]

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
